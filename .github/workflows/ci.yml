name: CI

on:
  push:
    branches: [main]
  # No paths-ignore: branch protection requires these checks, so a PR that skips
  # the workflow (docs only, say) could never report them and never merge.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly full test on all Python versions

env:
  CACHE_VERSION: v1

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests
        if: github.event_name != 'schedule'
        run: |
          make test-fast

      - name: Run full tests (scheduled)
        if: github.event_name == 'schedule'
        run: |
          make test

  # Separate job so the "Test Coverage" status that branch protection requires is
  # reported (it used to come from the coverage.yml workflow removed in 5f6706a).
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -n auto -v --cov=src/fitanalyzer --cov-report=term-missing --cov-report=html --junitxml=pytest-results.xml

      - name: Generate coverage report
        run: |
          coverage xml
          coverage html

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=95

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pytest-results.xml
          check_name: Test Results

      - name: Coverage PR Comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          make lint

      - name: Check code formatting with black
        run: |
          black --check src/ tests/

      - name: Run type checking with mypy
        run: |
          make type-check

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Resolve fitanalyzer's runtime dependencies in their own venv, so the scan
          # covers what users install and not safety's and bandit's own packages.
          python -m venv "$RUNNER_TEMP/runtime-env"
          "$RUNNER_TEMP/runtime-env/bin/pip" install -e .
          "$RUNNER_TEMP/runtime-env/bin/pip" freeze --exclude-editable > runtime-requirements.txt
          pip install bandit[toml] safety

      - name: Run safety check on dependencies
        run: |
          echo "🔍 Scanning runtime dependencies for known security vulnerabilities..."
          # Note: 'check' is deprecated but 'scan' requires authentication setup
          safety check -r runtime-requirements.txt --output=text

      - name: Run bandit security scan on code
        run: |
          echo "🔍 Scanning source code for security issues..."
          bandit -r src/ -ll -f screen

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, coverage, lint, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "import fitanalyzer; print(f'✅ Package version: {fitanalyzer.__version__}')"
          python -c "from fitanalyzer import summarize_fit_original; print('✅ Main functions importable')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
