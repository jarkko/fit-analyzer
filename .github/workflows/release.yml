name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if CI passed on this commit
        run: |
          # Get the commit SHA this tag points to
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Tag points to commit: $COMMIT_SHA"

          # Wait a moment for CI to start (if just pushed)
          sleep 10

          # Check CI status using GitHub CLI
          gh run list --commit $COMMIT_SHA --workflow=ci.yml --json conclusion,status,name --limit 1 > ci_status.json
          cat ci_status.json

          # Check if CI completed successfully
          CI_CONCLUSION=$(jq -r '.[0].conclusion // "pending"' ci_status.json)
          CI_STATUS=$(jq -r '.[0].status // "unknown"' ci_status.json)

          echo "CI Status: $CI_STATUS"
          echo "CI Conclusion: $CI_CONCLUSION"

          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "❌ ERROR: CI has not passed for this commit!"
            echo "CI must pass before releasing."
            echo "Current status: $CI_STATUS ($CI_CONCLUSION)"
            exit 1
          fi

          echo "✅ CI passed! Proceeding with release..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/* || true
        continue-on-error: true

    # Uncomment when ready to publish to real PyPI
