[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitanalyzer"
version = "0.4.2"
description = "A Python library for analyzing Garmin FIT files and calculating training metrics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FIT Analyzer Contributors"}
]
keywords = ["garmin", "fit", "fitness", "training", "analysis", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fitparse>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "garth>=0.5.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-xdist>=3.0.0",
    "flake8>=7.0.0",
    "flake8-functions>=0.0.8",  # Enforce function length limits
    "black>=24.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
fitanalyzer-parse = "fitanalyzer.cli:main"
fitanalyzer-sync = "fitanalyzer.sync:main"
fitanalyzer-setup = "fitanalyzer.credentials:main"

[tool.black]
# Black code formatter configuration
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# Import sorting configuration
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "venv", "build", "dist"]

[tool.pylint.master]
# Pylint configuration
ignore = [".venv", "venv", "build", "dist"]
jobs = 0  # Use all CPU cores
persistent = true
unsafe-load-any-extension = false

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "df", "s", "d", "f", "ff", "np", "pd"]

[tool.pylint.design]
# Enforce function and class complexity limits
# These limits were established after v0.4.2 quality improvements
max-args = 5              # Maximum number of function arguments (enforced)
max-locals = 15           # Maximum number of local variables
max-returns = 6           # Maximum number of return statements
max-branches = 12         # Maximum number of branches (if/elif/else)
max-statements = 50       # Maximum number of statements in a function
max-parents = 7           # Maximum number of parent classes
max-attributes = 7        # Maximum number of instance attributes
min-public-methods = 0    # Minimum number of public methods (0 = no limit)
max-public-methods = 20   # Maximum number of public methods
max-bool-expr = 5         # Maximum number of boolean expressions

[tool.pylint.refactoring]
# Enforce function length and nesting limits
# After v0.4.2 refactoring, all functions meet these standards
max-nested-blocks = 3     # Maximum nesting level (enforced - reduced from 5)
# Note: Function line count is indirectly controlled by max-statements
# Our target is ≤40 lines of code (≤50 statements)

[tool.pylint.messages_control]
# Enable all default checks, disable only when absolutely necessary
# Note: too-many-lines is disabled for sync.py which is a CLI entrypoint module
disable = [
    "too-many-lines",     # Module length is less critical than function complexity
]

[tool.mypy]
# MyPy type checking configuration
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_any_unimported = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = false  # Can enable later for even stricter checking
disallow_untyped_decorators = false  # Many decorators don't have types
strict_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "fitparse",
    "fitparse.*",
    "garth",
    "garth.*",
    "pandas",
    "numpy",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
# Coverage configuration
source = ["src/fitanalyzer"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/.venv/*",
    "*/venv/*",
    "*/examples/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 95.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
